services:
  postgres:
    image: postgres:16-alpine
    container_name: flagranks-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flagranks
    ports:
      - "5432:5432"
    volumes:
      - flagranks_data:/var/lib/postgresql/data

volumes:
  flagranks_data:
